server:
  port: ${PORT:8084}

spring:
  application:
    name: job-service

  # ✅ Cloud Database (Secure)
  datasource:
    url: ${DB_URL:jdbc:postgresql://ep-divine-resonance-a12py9f3.ap-southeast-1.aws.neon.tech/jobdb?sslmode=require}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD:npg_Zmkp2RhIoA1n} # WARNING: Update this password in NeonDB if it was leaked on GitHub!
    driver-class-name: org.postgresql.Driver

  # ✅ JPA Configuration (Production Safe)
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}   # Production mein hamesha validate use karein
    show-sql: ${SHOW_SQL:false}        # Logs ko clean rakhne ke liye false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  # ✅ Large File Uploads Permission
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# ✅ Eureka Discovery (Secure)
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}

# ✅ JWT Secret (Secure)
application:
  security:
    jwt:
      secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# ✅ DigitalOcean Spaces (Secure)
minio:
  url: ${STORAGE_URL:https://sgp1.digitaloceanspaces.com}
  access-key: ${STORAGE_ACCESS_KEY:DO801H2PZNRUZGXDTTUU}
  secret-key: ${STORAGE_SECRET_KEY:3jkc3zc/qm7zmCmdOwUuC50EpmnJjn6PugulQCwH0wg}
  bucket-name: ${STORAGE_BUCKET:printpass-storage}

# ✅ OpenFeign Resiliency
feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 5000

# ✅ API Documentation & Monitoring
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health, info

# ✅ Production Logging
logging:
  level:
    root: INFO
    com.printpass.job: INFO
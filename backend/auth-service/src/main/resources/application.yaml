server:
  port: ${PORT:8081}             # Cloud environment automatically apna port de sakega

spring:
  application:
    name: auth-service           # Eureka mein is naam se register hoga

# Eureka Client Configuration
eureka:
  client:
    service-url:
      # DO par hum EUREKA_URI environment variable set karenge
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# JWT Configuration
application:
  security:
    jwt:
      # Secret key ab secure environment variable se aayegi (Gateway wali same key)
      secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration: ${JWT_EXPIRATION:86400000}   # 24 hours in milliseconds

# OpenFeign Configuration
feign:
  client:
    config:
      default:
        connect-timeout: 5000    # Agar 5 second tak jawab na aaye toh timeout
        read-timeout: 5000

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

# API Documentation Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Logging Configuration
logging:
  level:
    root: INFO
    com.printpass.authservice: INFO   # Production mein INFO hona zaroori hai
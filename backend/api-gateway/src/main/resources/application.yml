server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      # 🌟 THE WINNING MOVE: React Frontend Allow List
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      routes:
        # 1. User/Auth Service
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**, /api/auth/**

        # 2. Shop Service
        - id: shop-service
          uri: lb://SHOP-SERVICE
          predicates:
            - Path=/api/shops/**
          # 💡 Jadoo: Yahan filter nahi likha, Java Global Filter khud handle karega!

        # 3. Job Service
        - id: job-service
          uri: lb://JOB-SERVICE
          predicates:
            - Path=/api/jobs/**

# 🔐 JWT Secret Key (Java code ab yahan se key parhega)
jwt:
  secret: printpass-super-secret-key-must-be-very-long-and-secure-1234567890

eureka:
  client:
    service-url:
      # 🛡️ THE UPGRADE: Ab hum password ke sath Discovery Server jayenge!
      defaultZone: http://admin:admin123@localhost:8761/eureka/
server:
  port: ${PORT:8080}                      # DO automatically port inject kar sakega

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # ========== AUTH SERVICE ==========
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authService
                fallbackUri: forward:/fallback/auth

        # ========== USER SERVICE ==========
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/shops/**, /api/v1/admin/**, /api/v1/internal/**, /api/v1/otp/**
          filters:
            - name: CircuitBreaker
              args:
                name: userService
                fallbackUri: forward:/fallback/user

        # ========== JOB SERVICE ==========
        - id: job-service
          uri: lb://job-service
          predicates:
            - Path=/api/v1/jobs/**
          filters:
            - name: CircuitBreaker
              args:
                name: jobService
                fallbackUri: forward:/fallback/job

# Eureka Configuration
eureka:
  client:
    service-url:
      # Localhost ki jagah ab DO par EUREKA_URI variable kaam aayega
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# JWT Configuration
application:
  security:
    jwt:
      # Secret key ab secure environment variable se aayegi
      secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# Resilience4j Global Configuration
resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: ${GATEWAY_TIMEOUT:10s}  # Default 10s, cloud se 60s kar sakte hain agar chahein

# Actuator (Only keeping health safe for production monitoring)
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

# Logging (Production ready)
logging:
  level:
    root: INFO
    com.printpass.gateway: INFO
    # org.springframework.cloud.gateway: DEBUG # Isko sirf local issue fix karne ke liye uncomment karna
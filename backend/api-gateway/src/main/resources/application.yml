server:
  port: 8080                      # HLD mein decide kiya tha

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true           # Service discovery se routes automatically generate karo
          lower-case-service-id: true
      routes:
        # ========== AUTH SERVICE ==========
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authService
                fallbackUri: forward:/fallback/auth
          # Yahan Jwt filter NAHI lagana, kyunke login ke liye token nahi chahiye

        # ========== USER SERVICE ==========
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/shops/**, /api/v1/admin/**, /api/v1/internal/**, /api/v1/otp/**
          filters:
            - name: CircuitBreaker
              args:
                name: userService
                fallbackUri: forward:/fallback/user

        # ========== JOB SERVICE ==========
        - id: job-service
          uri: lb://job-service
          predicates:
            - Path=/api/v1/jobs/**
          filters:
            - name: CircuitBreaker
              args:
                name: jobService
                fallbackUri: forward:/fallback/job

# Eureka Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# JWT Configuration (same secret key as other services)
application:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# Resilience4j Global Configuration
resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: 60s  # 👈 Ab Gateway har service ka 60 second wait karega!

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    com.printpass.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
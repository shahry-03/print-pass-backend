server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      # Yahan hum Gateway ko rasta bata rahe hain
      # user-service mein filter mat lagayega, warna login bhi band ho jayega!
      routes:
        - id: user-service
          uri: lb://USER-SERVICE   # 'lb' ka matlab hai Load Balancer (Eureka se address dhoondho)
          predicates:
            - Path=/api/users/** # Agar URL mein yeh aaye, toh USER-SERVICE ko bhej do
      # NAYA Route shop-service ke liye
        - id: shop-service
          uri: lb://SHOP-SERVICE
          predicates:
            - Path=/api/shops/**
          filters:
            - AuthenticationFilter   # NAYI LINE: Guard yahan khara hoga!

        # NAYA Route job-service ke liye
        - id: job-service
          uri: lb://JOB-SERVICE
          predicates:
            - Path=/api/jobs/**
          filters:
            - AuthenticationFilter   # NAYI LINE: Guard yahan khara hoga!

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
server:
  port: ${PORT:8761}

spring:
  application:
    name: discovery-server
  # Cloud par Eureka ko secure karna lazmi hai!
  security:
    user:
      name: ${EUREKA_USERNAME:admin}
      password: ${EUREKA_PASSWORD:admin123}

eureka:
  instance:
    # DO par hum EUREKA_HOSTNAME variable pass karenge (e.g., aapka DO App URL ya IP)
    hostname: ${EUREKA_HOSTNAME:localhost}
    prefer-ip-address: true
  client:
    register-with-eureka: false   # Main khud boss hun, mujhe list mein mat dalo
    fetch-registry: false         # Mujhe kisi aur se list nahi mangni
  server:
    wait-time-in-ms-when-sync-empty: 0
    enable-self-preservation: true # 👈 PRODUCTION ke liye TRUE lazmi hai

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

# Logging (Production mein WARN pe rakhein taake disk space na bhare)
logging:
  level:
    root: INFO
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
version: '3.8'

services:
  discovery-server:
    build: ./discovery-server
    container_name: discovery-server
    ports:
      - "8761:8761"
    env_file:
      - .env
    environment:
      - EUREKA_HOSTNAME=discovery-server
    networks:
      - printpass-network

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - EUREKA_URI=http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@discovery-server:8761/eureka/
    depends_on:
      - discovery-server
    networks:
      - printpass-network

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - EUREKA_URI=http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@discovery-server:8761/eureka/
    depends_on:
      - discovery-server
    networks:
      - printpass-network

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      - EUREKA_URI=http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@discovery-server:8761/eureka/
    depends_on:
      - discovery-server
    networks:
      - printpass-network

  job-service:
    build: ./job-service
    container_name: job-service
    ports:
      - "8084:8084"
    env_file:
      - .env
    environment:
      - EUREKA_URI=http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@discovery-server:8761/eureka/
    depends_on:
      - discovery-server
    networks:
      - printpass-network

# Ye custom network sab containers ko aapas mein connect karega
networks:
  printpass-network:
    driver: bridge
server:
  port: ${PORT:8082}

spring:
  application:
    name: user-service

  # ✅ Database configuration (Secure)
  datasource:
    url: ${DB_URL:jdbc:postgresql://ep-divine-resonance-a12py9f3-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD:npg_Zmkp2RhIoA1n} # Reminder: Change this in NeonDB!
    driver-class-name: org.postgresql.Driver
    hikari:
      max-lifetime: 600000
      keepalive-time: 300000

  # ✅ JPA Configuration (Production Safe)
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:create}   # Production mein validate use karein
    show-sql: ${SHOW_SQL:false}        # Logs clean rakhne ke liye false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  # ✅ Mail Configuration (Secure)

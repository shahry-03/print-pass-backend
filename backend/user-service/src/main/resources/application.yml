server:
  port: 8082     # Decided to use port 8082 for the user service in HLD
spring:
  application:
    name: user-service  # Eureka service name, important for service discovery and logging

    # Database configuration for PostgreSQL
  datasource:
    # 1. Shuru mein 'jdbc:' lagana zaroori hai
    # 2. @ sign se pehle wala hissa (username/password) yahan se nikal diya hai
    url: jdbc:postgresql://ep-divine-resonance-a12py9f3-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
    username: neondb_owner
    password: npg_Zmkp2RhIoA1n
    driver-class-name: org.postgresql.Driver
    hikari:
      max-lifetime: 600000 # 10 minutes se pehle connection refresh karega
      keepalive-time: 300000 # Har 5 minute baad database ko 'hello' bolega taake wo soye na


  # JPA and Hibernate configuration for PostgreSQL
  jpa:
    hibernate:
      ddl-auto: update      # Development ke liye 'update' theek hai, production mein 'validate' ya 'none' use karna chahiye
    show-sql: true          # Development ke liye SQL queries dekhna useful hota hai, production mein false kar dena chahiye
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true    # SQL queries ko formatted way mein dikhane ke liye

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:shahrayarsahito7@gmail.com}
    password: ${MAIL_PASSWORD:pwxqzgownpdyxilx}  # Yahan apna 16-digit code bina spaces ke likhein
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


  # Eureka client configuration for service discovery
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/  # Eureka server ka URL
    register-with-eureka: true  # Service ko Eureka server mein register karna
    fetch-registry: true       # Eureka server se registry information fetch karna


#JWT secret key configuration for token generation and validation
application:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970  # JWT secret key, production mein isse environment variable ya secure vault se lena chahiye
      expiration: 86400000  # JWT token expiration time in milliseconds (24 hours)


#Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics  # Actuator endpoints ko expose karna
    endpoint:
      health:
        show-details: always  # Health endpoint details hamesha dikhana, development ke liye useful hai








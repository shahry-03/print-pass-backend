server:
  port: ${PORT:8084}

spring:
  # Cloud Database (Secure)
  datasource:
    url: ${JOB_DB_URL}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA Configuration (Production Safe)
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}   # Production ke liye validate hi rakhein
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  # FLYWAY CONFIGURATION
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Large File Uploads Permission
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# ==========================================
# EUREKA CONFIG (Azure)
# ==========================================
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://discovery-server/eureka/}
  instance:
    prefer-ip-address: false
    hostname: ${spring.application.name} # Azure isay khud handle karega
    instance-id: ${spring.application.name}:${server.port}

# ==========================================
# SECRETS & CONFIGS (Env Vars se aayenge)
# ==========================================
application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      
minio:
  url: ${STORAGE_URL}
  access-key: ${STORAGE_ACCESS_KEY}
  secret-key: ${STORAGE_SECRET_KEY}
  bucket-name: ${STORAGE_BUCKET}

# ==========================================
# EXTERNAL SERVICES (Azure Standard)
# ==========================================
# Gotenberg ka Azure Internal URL (Bina port ke)
GOTENBERG_URL: http://gotenberg 

# User Service ka Azure Internal URL (Bina port ke)
USER_SERVICE_URL: http://user-service 

feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 5000

# API Documentation & Monitoring
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health, info

# Production Logging
logging:
  level:
    root: INFO
    com.printpass.job: INFO
name: PrintPass CI/CD Pipeline

# Ye pipeline tab chalegi jab bhi 'main' branch par naya code push hoga
on:
  push:
    branches: [ "main" ]

jobs:
  # 🧪 PEHLA JOB: Code ko Test karna
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17 (For Spring Boot)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests
        working-directory: ./backend  # 🚨 Ye line Actions ko batayegi ke pehle backend folder mein jaye
        run: mvn test

  # 🚀 DOOSRA JOB: Server par Deploy karna (Sirf tab chalega jab test paas honge)
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            # Dhyan rahe ke server par aapke folder ka naam PrintPass hi ho
            cd PrintPass
            
            # Naya code GitHub se layein
            git pull origin main
            
            # Purane containers band karein aur naye build karke chalayen
            docker-compose down
            docker-compose up -d --build
            
            # Faltu purani images delete karein taake server space bache
            docker image prune -f
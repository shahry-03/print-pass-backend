server:
  port: ${PORT:8082}

spring:
  datasource:
    url: ${USER_DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 60000
      max-lifetime: 300000
      idle-timeout: 120000
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}   # Production mein sirf validate chalega
    show-sql: ${SHOW_SQL:false}
  flyway:
    enabled: true
    baseline-on-migrate: true

# ==========================================
# EUREKA CONFIG (Azure)
# ==========================================
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://discovery-server/eureka/} # Azure standard URL
  instance:
    prefer-ip-address: false
    hostname: ${spring.application.name} # Azure handle karega
    instance-id: ${spring.application.name}:${server.port}

# ==========================================
# SECRETS & CONFIGS
# ==========================================
resend:
  api:
    key: ${RESEND_API_KEY}
  from-email: "PrintPass <support@send.printpass.tech>" 
  subject: "PrintPass Account Verification"

otp:
  expiration:
    minutes: 10

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:86400000}

app:
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}

springdoc:
  api-docs:
    path: /v3/api-docs 
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.printpass: INFO